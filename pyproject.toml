[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ati-shadow-policy"
version = "0.1.0"
description = "Public-data measurement of Treasury maturity composition and provisional pricing associations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "pdfplumber>=0.11.0",
  "statsmodels>=0.14.0",
  "pyarrow>=15.0.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Script entry points add the checkout's src directory before package imports.
"scripts/*.py" = ["E402"]
